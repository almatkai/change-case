[package]
name = "tezbar-change-case"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT AND Apache-2.0 AND Unicode-3.0"
description = "Offline pure Rust Change Case core and compiled Tezbar Native V2 adapter"
repository = "https://github.com/almatkai/change-case"
include = ["src/**", "adapter.rs", "tests/**", "examples/**", "data/**", "assets/**", "licenses/**", "validation/*.py", "validation/*.mjs", "validation/*.template", "validation/schema-requirements.txt", "validation/oracle/**", "fixtures/**", "/README.md", "/INTEGRATION.md", "/VALIDATION.md", "/NOTICES.md", "/manifest.json", "/provenance.json", "/Cargo.toml", "/Cargo.lock", "/.gitignore"]

[dependencies]
serde_json = "=1.0.145"
getrandom = "=0.2.16"

[dev-dependencies]
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "=3.23.0"
log = "=0.4.28"
